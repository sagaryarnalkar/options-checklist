<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HeroZero</title>
    <meta name="description" content="HeroZero Trader Terminal: option chain, open interest, Greeks, IV, strategy payoffs and the HeroZero desk. Data for education and research. Not investment advice." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F4EE" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#060809" />

    <!-- canonical, og:url and the JSON-LD are filled in at build time by the site-meta plugin in
         vite.config.ts from VITE_SITE_URL. HeroZero mark: public/favicon.svg (+ .ico / PNG icons). -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HeroZero" />
    <meta name="application-name" content="HeroZero" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&family=Plus+Jakarta+Sans:ital,wght@0,500..800;1,500..800&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <script>
      // Apply the saved scheme before first paint. "system" (default) follows the OS.
      (function () {
        var root = document.documentElement;
        var mode = "system";
        try {
          var saved = window.localStorage.getItem("theme");
          if (saved === "light" || saved === "dark" || saved === "system") mode = saved;
        } catch (e) {
          /* storage blocked: follow the system */
        }
        var dark = false;
        try {
          dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (e) {
          dark = mode === "dark";
        }
        root.classList.toggle("dark", dark);
        try {
          if (window.localStorage.getItem("palette") === "cvd") root.setAttribute("data-palette", "cvd");
        } catch (e) {
          /* storage blocked: default palette */
        }
        root.style.colorScheme = dark ? "dark" : "light";
        if (mode !== "system") {
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", dark ? "#060809" : "#F3F4EE");
        }
      })();
    </script>

    <meta property="og:title" content="HeroZero" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HeroZero" />
    <meta property="og:image" content="__OG_IMAGE__" />
  </head>

  <body>
    <noscript>HeroZero needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
